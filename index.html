    let dev = await store.getMeta('dev');
    if (!dev) { dev = DSHCore.randomDev(); await store.setMeta('dev', dev); }
    state.dev = dev;
    // 载入本地历史：**已见集合保持全局**（防重放，id 是 16 随机字节，跨房间不会误判），
    // 但只有属于当前房间的记录进入渲染集合（换密码/换房间不得把上一个房间的消息显示出来）。
    for (const r of await store.allMsgs()) {
      state.seen.add(r.id);
      if (r.room === state.room) state.byId.set(r.id, r);
    }
    // 已见集合本身也持久化在 IndexedDB 的 seen 存储里（协议 §5.2 明确要求），一并载入
    for (const id of await store.seenAll()) state.seen.add(id);
    // 游标按房间隔离
    state.cursor = await store.getMeta('cursor:' + state.room);

    // 切屏
    $('#gate').hidden = true;
    $('#chat').hidden = false;
    $('#roomInfo').textContent = '房间 ' + state.room.slice(0, 10) + '… · 验证码 ' + state.fp + ' · 本机 ' + state.dev
      + ' · 存储 ' + kind;
    setStatus('idle', '连接中…');
    render();

    // 信箱：先做一次增量拉取，再订阅。
    // 优先 Cloudflare D1（持久，无 12 小时窗口）；未部署或不可达时自动回退 ntfy。
    state.mailbox = await pickMailbox(d);
    $('#roomInfo').textContent += ' · 信箱 ' + (state.backend || '') + (state.backendNote ? '（回退原因：' + state.backendNote + '）' : '');
    try {
      const r = await refresh(state.cursor === undefined ? null : state.cursor);
      if (r.ingested === 0) render();   // 房间为空时提示可见
    } catch (e) {
      setStatus('error', '离线（首拉失败）');
      toast('首次拉取失败：' + (e && e.message || e) + '，将继续重试');
    }
    state.unsubscribe = state.mailbox.subscribe((m) => { ingest(m).catch(() => { }); }, {
      since: state.cursor,
      onStatus: (kind2, detail) => {
        if (kind2 === 'sse') setStatus('sse', '已连接（实时）');
        else if (kind2 === 'polling') setStatus('polling', '连接中（' + (state.backend || '') + '）');
        else if (kind2 === 'polling-ok') setStatus('polling', '已连接（' + (state.backend || '') + '）');
        else if (kind2 === 'error') setStatus('error', '离线（' + detail + '）');
      },
    });
    // 保底轮询：即使 SSE 正常，也每 60 秒补一次增量，兜住 SSE 丢帧。
    // ⚠️ 必须带可见性守卫：ntfy 的令牌桶是「突发 60 个 + 每 5 秒补 1 个」（≈17,340 请求/天），
    //    后台/锁屏继续轮询会烧掉令牌并可能触发 fail2ban 封 IP（协议 §5.4）。
    //    周期取 60 秒而非 30 秒：与降级轮询叠加后仍留余量。
    state.fallbackTimer = setInterval(() => {
      if (typeof document !== 'undefined' && document.visibilityState === 'hidden') return;
      refresh().catch(() => { }); flushOutbox().catch(() => { });
    }, 60000);
    return true;
  }
  // 网络状态变化只注册一次（放在 enterRoom 里会在每次换房间时重复注册）
  window.addEventListener('online', () => setStatus(state.status === 'sse' ? 'sse' : 'polling', '网络恢复，重连中…'));
  window.addEventListener('offline', () => setStatus('error', '离线（设备无网络）'));

  // ------------------------------------------------------------ 8. 交互绑定
  $('#pw').addEventListener('input', () => {
    const raw = $('#pw').value;
    const norm = DSHCore.normalizePassphrase(raw);
    const form = DSHCore.detectForm(norm);
    const el = $('#strength');
    if (!norm) { el.className = 'strength'; el.textContent = ''; return; }
    if (form === 'H') { el.className = 'strength ok'; el.textContent = '形态 H：64 位 hex = 256 bit 熵（推荐）'; }
    else if (form === 'B') { el.className = 'strength ok'; el.textContent = '形态 B：base64url 密钥串，' + norm.length + ' 字符（高熵）'; }
    else {
      el.className = 'strength warn';
      el.textContent = '⚠️ 形态 P：可记忆口令（' + norm.length + ' 字符）。弱口令会让房间地址可被离线枚举——这是本方案唯一无法用密码学弥补的缺口。建议 ≥6 个 Diceware 词或改用 64 位 hex。';
    }
  });
  $('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#enter').click(); });
  $('#enter').addEventListener('click', () => { enterRoom(null).catch((e) => toast('进入失败：' + e.message)); });
  $('#send').addEventListener('click', () => { send().catch((e) => toast('发送异常：' + e.message)); });
  const ta = $('#text');
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#send').click(); }
  });
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 132) + 'px'; });
  $('#copyFp').addEventListener('click', async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(state.fp); toast('验证码已复制：' + state.fp); return; }
      throw new Error('no clipboard api');
    } catch (e) {
      window.prompt('请手动复制房间验证码（两人一致即同一房间）：', state.fp);
    }
  });

  // ------------------------------------------- 9. 测试钩子（headless 取证用）
  window.__DSH_TEST__ = {
    core: DSHCore, env,
    state: () => ({
      room: state.room, fp: state.fp, dev: state.dev, argon2Source: state.argon2Source,
      status: state.status, storeKind: store.kind, messages: sortedMessages().map((m) => ({
        id: m.id, body: m.body, mine: m.mine, dev: m.dev, serverTime: m.serverTime, pending: !!m.pending,
      })),
    }),
    deriveFor: async (pw) => {
      const d = await DSHCore.deriveKeys(pw, state.argon2id);
      const out = {
        form: d.form, room: d.room, fingerprint: d.fingerprint,
        kRoom: DSHCore.bytesToHex(d.kRoom), kEnc: DSHCore.bytesToHex(d.kEnc),
        kArc: DSHCore.bytesToHex(d.kArc), kPad: DSHCore.bytesToHex(d.kPad),
        argon2idMs: d.timings.argon2idMs, argon: d.argon,
      };
      DSHCore.wipe(d.kEnc); DSHCore.wipe(d.kArc); DSHCore.wipe(d.kPad); DSHCore.wipe(d.kRoom);
      return out;
    },
    /** 用页面自己的核心加密一条固定载荷，返回 wire（供 Node 侧解密做双向互操作证明） */
    sealFixed: async (pw, payload) => {
      const d = await DSHCore.deriveKeys(pw, state.argon2id);
      try {
        const key = await DSHCore.importEncKey(d.kEnc);
        return await DSHCore.sealWithKey(key, payload);
      } finally {
        DSHCore.wipe(d.kEnc); DSHCore.wipe(d.kArc); DSHCore.wipe(d.kPad); DSHCore.wipe(d.kRoom);
      }
    },
    /** 用页面自己的核心解密 Node 侧产出的 wire */
    openFixed: async (pw, wire) => {
      const d = await DSHCore.deriveKeys(pw, state.argon2id);
      try {
        const key = await DSHCore.importEncKey(d.kEnc);
        return await DSHCore.openWithKey(key, wire);
      } finally {
        DSHCore.wipe(d.kEnc); DSHCore.wipe(d.kArc); DSHCore.wipe(d.kPad); DSHCore.wipe(d.kRoom);
      }
    },
    enterRoom: (pw) => enterRoom(pw),
    forceSend: (text) => { $('#text').value = text; return send(); },
    /** 测试用：强制全量重拉（since=all），用于验证「已见 id 集合持久化 ⇒ 刷新后不会被重放」 */
    forceRefetchAll: async () => {
      const r = await refresh(null);
      return { count: r.count, ingested: r.ingested, seen: state.seen.size, shown: state.byId.size };
    },
  };

  // ------------------------------------------------------------ 10. 启动
  (async function boot() {
    const r = await loadArgon2();
    if (!r.argon2id) {
      note('err', '❌ <b>Argon2id 库加载失败，无法加密</b>——这不是静默失败，下面列出全部尝试：'
        + '<br><code>' + r.errors.map((s) => s.replace(/</g, '&lt;')).join('</code><br><code>') + '</code>'
        + '<br>处理办法：① 检查网络能否访问 unpkg.com；② <code>file://</code> 打开时必须保证 '
        + '<code>vendor/argon2.umd.min.js</code> 与 <code>index.html</code> 在同一目录（或用 <code>?ar2=local</code> 强制本地）。');
      $('#enter').disabled = true;
      $('#gateHint').className = 'hint err';
      $('#gateHint').textContent = 'Argon2id 不可用：' + r.errors.join(' | ');
      window.__DSH_READY__ = 'argon2-failed';
      return;
    }
    state.argon2id = r.argon2id;
    state.argon2Source = r.source;
    if (ar2Param === 'fail') {
      window.__DSH_READY__ = 'argon2-failed';
      return;
    }
    $('#enter').disabled = !cryptoOk;
    window.__DSH_READY__ = true;
  })();
})();
</script>
</body>
</html>
